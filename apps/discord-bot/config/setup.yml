panels:
  welcome:
    eyebrow: "SLICE COMMUNITY"
    title: "Welcome to Slice"
    description: |
      A focused space for collecting, market context, and private support.

      **Find your place**
      ◈ **My Slice** — your private account companion
      📈 **Market** — public marketplace activity
      🗂️ **Collector Hub** — submit a collectible
      🎫 **Support** — private help when you need it
    color: info
    timestamp: false
  start-here:
    title: "Start in 60 Seconds"
    description: |
      **1. Connect**
      Link your Slice account through the official handoff.

      **2. Choose alerts**
      Pick only the listing, market, auction, and update notifications you want.

      **3. Explore**
      Browse marketplace signals, community discussion, and support resources.
    color: info
    footer: "Slice AI | Simple onboarding"
  rules:
    title: "Community Standards"
    description: |
      **Professional by default**
      Respect members, staff, privacy, intellectual property, and Discord rules.

      **Keep private data private**
      Never post credentials, banking details, identity documents, API keys, seed phrases, or private account information.

      **No financial advice**
      Marketplace discussion is educational and community-based. Nothing in Discord is investment, tax, legal, or account advice.
    color: warning
    footer: "Slice AI | Safety first"
  verify:
    eyebrow: "SLICE ACCESS"
    title: "Verify to enter Slice"
    description: |
      Complete a short human check to unlock the server.

      This only protects Discord access. It does not verify your identity, banking, or Slice account.
    color: info
    timestamp: false
  roles:
    eyebrow: "YOUR PREFERENCES"
    title: "Choose what you want to follow"
    description: |
      Personalize the updates you receive from Slice.

      These roles only control notifications and community preferences. They do not change your Slice account, ownership, permissions, or verification status.
    color: info
    timestamp: false
  faq:
    title: "Slice Help Center"
    description: |
      **Fast answers before opening a ticket**
      Read guidance for marketplace questions, security, account access, seller support, verification, deposits, withdrawals, and ownership records.

      If the answer depends on your account, use private support.
    color: info
    footer: "Slice AI | Help center"
  my-slice:
    eyebrow: "MY SLICE"
    title: "Your Slice account, inside Discord."
    description: |
      Use `/slice` or the controls below for a private view of your account.

      Sensitive results are visible only to you.
    color: info
    timestamp: false
  announcements:
    eyebrow: "SLICE UPDATES"
    title: "Platform announcements"
    description: |
      Important product, marketplace, maintenance, and Beta updates from Slice.
    color: info
    timestamp: false
  platform-updates:
    title: "Platform Updates"
    description: |
      **Release notes, maintenance, and improvements**
      Follow product updates, maintenance notes, safe workarounds, and Discord experience changes.

      This channel is read-only so updates stay easy to scan.
    color: info
    footer: "Slice AI | Product notes"
  market-feed:
    eyebrow: "SLICE MARKET"
    title: "Marketplace activity"
    description: |
      New Initial Offerings and meaningful marketplace updates.

      Availability and pricing are confirmed on Slice.
    color: info
    timestamp: false
  recent-sales:
    title: "Recent Sales"
    description: |
      **Public sale context**
      Review public sale signals when Slice provides them. Use this for context, not advice.

      Availability, pricing, and eligibility may change.
    color: info
    footer: "Slice AI | Public data only"
  price-alerts:
    title: "Price Alerts"
    description: |
      **Track movement without the noise**
      Price movement alerts are delivered when configured and available.

      Alerts are informational and never a recommendation to buy, sell, or hold.
    color: warning
    footer: "Slice AI | Informational alerts"
  new-listings:
    title: "New Listings"
    description: |
      **Discover what is new**
      Browse new public Slice listings and discuss collecting context with the community.

      Use official Slice flows for availability, purchase, sale, or account actions.
    color: success
    footer: "Slice AI | Marketplace discovery"
  market-analysis:
    title: "Market Analysis"
    description: |
      **Research, context, and collector discussion**
      Compare public signals, hobby trends, set history, grading context, and community observations.

      Keep claims sourced and avoid financial advice.
    color: info
    footer: "Slice AI | Research space"
  collector-workspace:
    eyebrow: "FOR COLLECTORS"
    title: "Turn a collectible into an offering."
    description: |
      Submit a collectible to Slice, complete review and custody, then choose how much ownership you want to offer while retaining the rest.

      **1. Submit**
      **2. Review & secure**
      **3. Choose your offering**
    color: info
    timestamp: false
  list-a-collectible:
    eyebrow: "COLLECTOR SUBMISSIONS"
    title: "List a collectible with Slice."
    description: "Start your submission on Slice. Discord never collects card photos, identity documents, or financial information."
    color: info
    timestamp: false
  create-a-ticket:
    eyebrow: "PRIVATE SUPPORT"
    title: "How can we help?"
    description: |
      Choose the area that best matches your issue. Your request will be created privately and routed to the right team.
    color: info
    timestamp: false
  support-information:
    title: "Support Guidance"
    description: |
      **Use private tickets for account-specific help**
      Support can help with access, verification, marketplace issues, seller support, reports, technical problems, and security concerns.

      Do not post private account details in public channels.
    color: info
    footer: "Slice Support | Keep sensitive details private"
  known-issues:
    title: "Known Issues"
    description: |
      **Current issues and safe workarounds**
      Check here before opening a ticket. If your issue is account-specific or security-sensitive, open private support.
    color: warning
    footer: "Slice Support | Status and workarounds"
  staff:
    title: "Operations Center"
    description: |
      **Fast operational companion.**
      Open an authorised Slice workspace for review, intake, asset operations, memberships, Trust & Support, Finance & Trading, or Platform Operations.

      Discord does not confirm receipt, publish assets, change memberships, alter balances, or replace the Admin Console.
    color: staff
    footer: "Slice AI | Authorised staff only"
  operations:
    eyebrow: "SLICE OPERATIONS"
    title: "Operations Center"
    description: |
      Internal Discord operations and service status. Slice remains the source of truth for operational authority.
    color: staff
    timestamp: false
  compliance-alerts:
    title: "Physical Intake"
    description: |
      **Carrier delivery is not Slice receipt confirmation.**
      Review delivered, receipt-pending, shipping-exception, and verification handoffs in the authoritative Physical Intake workspace.

      Receipt confirmation remains in Slice Admin.
    color: warning
    footer: "Slice AI | Physical intake"
  support-log:
    eyebrow: "SUPPORT OPERATIONS"
    title: "Support Queue"
    description: |
      Ticket activity and support handoffs for authorized staff.
    color: staff
    timestamp: false
  moderation-log:
    eyebrow: "REVIEW OPERATIONS"
    title: "Review Queue"
    description: "Links and notifications for review work. Final review authority remains in Slice."
    color: staff
    timestamp: false
  bot-log:
    eyebrow: "SYSTEM HEALTH"
    title: "Bot logs"
    description: |
      Important startup, command sync, worker, ticket, and setup-drift alerts appear here.

      Healthy routine activity stays out of this channel.
    color: staff
    timestamp: false
