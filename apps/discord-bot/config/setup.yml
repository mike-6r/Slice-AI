panels:
  welcome:
    title: "Welcome to Slice"
    description: |
      **Collectibles, market context, and private support in one organized workspace.**

      Use this server to discover public Slice information, follow official updates, discuss the hobby, and get routed to the right private support path.

      **Start**
      Connect your account, review the standards, choose alerts, then explore the marketplace channels.
    color: info
    footer: "Slice AI | Start here"
  start-here:
    title: "Start in 60 Seconds"
    description: |
      **1. Connect**
      Link your Slice account through the official handoff.

      **2. Choose alerts**
      Pick only the listing, market, auction, and update notifications you want.

      **3. Explore**
      Browse marketplace signals, community discussion, and support resources.
    color: info
    footer: "Slice AI | Simple onboarding"
  rules:
    title: "Community Standards"
    description: |
      **Professional by default**
      Respect members, staff, privacy, intellectual property, and Discord rules.

      **Keep private data private**
      Never post credentials, banking details, identity documents, API keys, seed phrases, or private account information.

      **No financial advice**
      Marketplace discussion is educational and community-based. Nothing in Discord is investment, tax, legal, or account advice.
    color: warning
    footer: "Slice AI | Safety first"
  verify:
    title: "Connect Your Slice Account"
    description: |
      **Secure handoff only**
      Account linking, identity checks, payments, deposits, withdrawals, ownership records, and transaction actions stay on the official Slice platform.

      Discord helps route you. Slice remains the source of truth.
    color: info
    footer: "Slice AI | Account security"
  roles:
    title: "Choose Your Alerts"
    description: |
      **Keep the server clean**
      Select only the notifications you want: listings, price alerts, rare finds, auctions, giveaways, news, market briefs, or platform updates.

      You can update these preferences anytime.
    color: info
    footer: "Slice AI | Notification control"
  faq:
    title: "Slice Help Center"
    description: |
      **Fast answers before opening a ticket**
      Read guidance for marketplace questions, security, account access, seller support, verification, deposits, withdrawals, and ownership records.

      If the answer depends on your account, use private support.
    color: info
    footer: "Slice AI | Help center"
  my-slice:
    title: "My Slice"
    description: |
      **Your account stays private.**
      Open Slice to manage your account, portfolio, orders, transactions, and account preferences.

      Discord is a companion. Slice remains authoritative for account, financial, and verification information.
    color: info
    footer: "Slice AI | Your private account"
  announcements:
    title: "Official Announcements"
    description: |
      **High-signal updates only**
      This channel is reserved for official Slice announcements, community notices, and important product communication.

      Questions belong in community channels or private support.
    color: info
    footer: "Slice AI | Official updates"
  platform-updates:
    title: "Platform Updates"
    description: |
      **Release notes, maintenance, and improvements**
      Follow product updates, maintenance notes, safe workarounds, and Discord experience changes.

      This channel is read-only so updates stay easy to scan.
    color: info
    footer: "Slice AI | Product notes"
  market-feed:
    title: "Curated Market Feed"
    description: |
      **Public marketplace signals**
      Watch curated listing, movement, and marketplace context when available.

      Private account values, transactions, and ownership records remain outside Discord.
    color: info
    footer: "Slice AI | Market signal"
  recent-sales:
    title: "Recent Sales"
    description: |
      **Public sale context**
      Review public sale signals when Slice provides them. Use this for context, not advice.

      Availability, pricing, and eligibility may change.
    color: info
    footer: "Slice AI | Public data only"
  price-alerts:
    title: "Price Alerts"
    description: |
      **Track movement without the noise**
      Price movement alerts are delivered when configured and available.

      Alerts are informational and never a recommendation to buy, sell, or hold.
    color: warning
    footer: "Slice AI | Informational alerts"
  new-listings:
    title: "New Listings"
    description: |
      **Discover what is new**
      Browse new public Slice listings and discuss collecting context with the community.

      Use official Slice flows for availability, purchase, sale, or account actions.
    color: success
    footer: "Slice AI | Marketplace discovery"
  market-analysis:
    title: "Market Analysis"
    description: |
      **Research, context, and collector discussion**
      Compare public signals, hobby trends, set history, grading context, and community observations.

      Keep claims sourced and avoid financial advice.
    color: info
    footer: "Slice AI | Research space"
  collector-workspace:
    title: "Collector Workspace"
    description: |
      **Manage your collectible journey on Slice.**
      Submit an asset, review only the actions that need your attention, choose a vault, add tracking, and follow receipt, verification, valuation, vault readiness, and Market Live on Slice.

      Carrier delivery and receipt confirmation are different steps. Slice confirms physical receipt after intake.

      Collector membership plans and capacity limits are always shown by Slice.
    color: info
    footer: "Slice AI | Collector workflow"
  create-a-ticket:
    title: "Open the Right Request"
    description: |
      **Private support starts here**
      Choose the closest support path so your request reaches the right team with the right context.

      Use tickets for account access, verification, deposits, withdrawals, seller support, marketplace issues, technical problems, partnerships, reports, or security concerns.
    color: info
    footer: "Slice Support | Private by default"
  support-information:
    title: "Support Guidance"
    description: |
      **Use private tickets for account-specific help**
      Support can help with access, verification, marketplace issues, seller support, reports, technical problems, and security concerns.

      Do not post private account details in public channels.
    color: info
    footer: "Slice Support | Keep sensitive details private"
  known-issues:
    title: "Known Issues"
    description: |
      **Current issues and safe workarounds**
      Check here before opening a ticket. If your issue is account-specific or security-sensitive, open private support.
    color: warning
    footer: "Slice Support | Status and workarounds"
  staff:
    title: "Operations Center"
    description: |
      **Fast operational companion.**
      Open an authorised Slice workspace for review, intake, asset operations, memberships, Trust & Support, Finance & Trading, or Platform Operations.

      Discord does not confirm receipt, publish assets, change memberships, alter balances, or replace the Admin Console.
    color: staff
    footer: "Slice AI | Authorised staff only"
  operations:
    title: "Asset Operations"
    description: |
      **Use this feed for meaningful operational handoffs.**
      Verification, valuation, custody, market readiness, and exceptions are reviewed in Slice.

      Discord never creates a second lifecycle state machine or auto-publishes an asset.
    color: staff
    footer: "Slice AI | Asset operations"
  compliance-alerts:
    title: "Physical Intake"
    description: |
      **Carrier delivery is not Slice receipt confirmation.**
      Review delivered, receipt-pending, shipping-exception, and verification handoffs in the authoritative Physical Intake workspace.

      Receipt confirmation remains in Slice Admin.
    color: warning
    footer: "Slice AI | Physical intake"
  support-log:
    title: "Support Queue"
    description: |
      **Discord tickets remain the canonical Discord support workflow.**
      Use this channel for ticket activity; open Slice for account, compliance, and escalation context.
    color: staff
    footer: "Slice AI | Trust & Support"
  bot-log:
    title: "System Alerts"
    description: |
      **High-signal platform alerts only.**
      Provider degradation, failed jobs, webhook exceptions, and protected configuration changes are investigated in Slice Platform Operations.
    color: warning
    footer: "Slice AI | Platform operations"
