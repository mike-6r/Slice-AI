messages:
  lifecycle:
    title: "Ticket {ticket_id}"
    description: |
      **Private Slice support request.**

      A staff member will review the category, context, and latest activity here. Keep all account-specific details inside this private channel.
    color: info
    footer: "Slice Support | Never share passwords, private keys, banking passwords, API keys, or identity documents in Discord"
  opened:
    title: "Ticket Created"
    description: "Your private support channel is ready: <#{ticket_id}>"
    color: success
  inactivity_warning:
    title: "Ticket Awaiting Response"
    description: "This request may be closed if no further response is received. Reply with any missing context when you are ready."
    color: warning
  closed:
    title: "Ticket Closed"
    description: "This request is now closed. Open a new ticket if you need help with a separate issue."
    color: info
