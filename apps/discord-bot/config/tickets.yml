categories:
  - { key: account-issues, label: "Account", emoji: "🔐", description: "Access, linking, profile, or verification help." }
  - { key: investment-issues, label: "Marketplace Guidance", emoji: "📈", description: "Questions about public Slice marketplace information." }
  - { key: withdrawal, label: "Payments & Wallet", emoji: "⚠️", description: "Account-specific payment or wallet support." }
  - { key: deposit, label: "Deposit Help", emoji: "💳", description: "Deposit status or account-specific deposit help." }
  - { key: report-user, label: "Report a User", emoji: "🛡️", description: "Report scams, spam, harassment, or unsafe conduct." }
  - { key: partnership, label: "Partnerships", emoji: "🤝", description: "Business, creator, seller, or brand partnership inquiries." }
  - { key: general-support, label: "Other", emoji: "🎫", description: "General help when no other category fits." }
  - { key: seller-support, label: "Collector Submission", emoji: "🗂️", description: "Submission, review, custody, or Collector support." }
  - { key: marketplace-issue, label: "Orders & Marketplace", emoji: "📈", description: "Order, listing, availability, or marketplace display help." }
  - { key: technical-issue, label: "Technical Issue", emoji: "⚙️", description: "Bot, Discord, command, or platform technical help." }
  - { key: verification-help, label: "Verification Help", emoji: "✅", description: "Safe guidance for official verification steps." }
  - { key: security-concern, label: "Security Concern", emoji: "🔒", description: "Urgent security, fraud, account, or impersonation concern." }
support_panel:
  placeholder: "Choose what you need help with"
  categories: [account-issues, seller-support, marketplace-issue, withdrawal, technical-issue, report-user, general-support]
timings:
  inactivity_warning_hours: 48
  inactivity_close_hours: 120
controls:
  claim: "Claim"
  unclaim: "Unclaim"
  waiting-user: "Waiting on Member"
  waiting-staff: "Waiting on Staff"
  escalate: "Escalate"
  priority: "Set Priority"
  transfer: "Transfer"
  resolve: "Resolve"
  close: "Close"
fields:
  reference: "Reference"
  category: "Category"
  status: "Status"
  priority: "Priority"
  creator: "Requester"
  assignee: "Assigned staff"
  subject: "Subject"
  created: "Created"
  updated: "Last updated"
  unassigned: "Unassigned"
  no_subject: "No subject supplied"
messages:
  lifecycle:
    eyebrow: "SUPPORT REQUEST"
    title: "We're on it."
    description: |
      A member of the Slice team can respond here. Keep account-specific details inside this private channel.
    color: info
    footer: "Slice • Never share passwords, private keys, banking passwords, API keys, or identity documents in Discord"
  opened:
    title: "Ticket Created"
    description: "Your private support channel is ready: <#{ticket_id}>"
    color: success
  inactivity_warning:
    title: "Ticket Awaiting Response"
    description: "This request may be closed if no further response is received. Reply with any missing context when you are ready."
    color: warning
  closed:
    title: "Ticket Closed"
    description: "This request is now closed. Open a new ticket if you need help with a separate issue."
    color: info
