name: slice-runtime

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slice}
      POSTGRES_USER: ${POSTGRES_USER:-slice_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slice_local_only_change_me}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - slice-postgres-data:/var/lib/postgresql/data
    networks: [slice-runtime]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    networks: [slice-runtime]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 10s

networks:
  slice-runtime:
    driver: bridge

volumes:
  slice-postgres-data:
