name: slice-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: slice_test
      POSTGRES_USER: slice_test
      POSTGRES_PASSWORD: slice_test_only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - slice-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slice_test -d slice_test']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  slice-test-postgres-data:
