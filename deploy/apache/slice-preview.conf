# Include this fragment inside the existing TLS VirtualHost. It serves only
# /preview and intentionally does not alter the root-path staging routes.

ProxyPass "/preview/assets/" "!"
Alias "/preview/assets/" "/opt/slice-preview/current/dist/client/assets/"
<Directory "/opt/slice-preview/current/dist/client/assets">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

ProxyPass "/preview/favicon.png" "!"
Alias "/preview/favicon.png" "/opt/slice-preview/current/dist/client/favicon.png"

ProxyPass        "/preview/api/" "http://127.0.0.1:3201/api/" retry=0 timeout=60
ProxyPassReverse "/preview/api/" "http://127.0.0.1:3201/api/"
ProxyPass        "/preview/health" "http://127.0.0.1:3201/health" retry=0 timeout=15
ProxyPassReverse "/preview/health" "http://127.0.0.1:3201/health"
ProxyPass        "/preview/ready" "http://127.0.0.1:3201/ready" retry=0 timeout=15
ProxyPassReverse "/preview/ready" "http://127.0.0.1:3201/ready"
ProxyPass        "/preview/" "http://127.0.0.1:3202/preview/" retry=0 timeout=60
ProxyPassReverse "/preview/" "http://127.0.0.1:3202/preview/"
