name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Changed-file lint
        run: |
          echo "Linting the pushed commit diff."
          node scripts/lint-changed.mjs
      - name: Full frontend lint baseline (known formatting debt)
        continue-on-error: true
        run: npm run lint

  backend:
    runs-on: ubuntu-latest
    # `prisma validate` resolves DATABASE_URL even though it does not connect.
    # Keep this verification job self-contained; the integration job below uses
    # the real ephemeral PostgreSQL service.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/slice_ci
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  discord:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/discord-bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/discord-bot/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: slice_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d slice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/slice_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            apps/discord-bot/package-lock.json
      - name: Install API dependencies
        run: npm ci
        working-directory: server
      - name: Run API database integration tests
        run: npm run test:integration
        working-directory: server
      - name: Install Discord dependencies
        run: npm ci
        working-directory: apps/discord-bot
      - name: Generate Discord Prisma client
        run: npm run prisma:generate
        working-directory: apps/discord-bot
      - name: Run Discord PostgreSQL integration tests
        run: npm run test:integration
        working-directory: apps/discord-bot
